plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.120'
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

tasks.named('processResources', ProcessResources).configure {
    filesMatching('**/*.toml') {
        expand(project.properties)
    }
    filesMatching('**/*.mcmeta') {
        expand(project.properties)
    }
}

base {
    archivesName = "${mod_id}-neoforge-${mod_version}"
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

neoForge {
    version = project.neo_version

    runs {
        client {
            client()
        }
        server {
            server()
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

repositories {
    maven { url = 'https://maven.aliyun.com/repository/central' }
    mavenCentral()
}

dependencies {
    // TFC — compileOnly（tag 引用 + Climate API）；fileTree glob 展开 mods 目录，mod 升级无需改此处
    compileOnly fileTree('../../mods') { include '*TerraFirmaCraft-NeoForge-*.jar' }
    // Firmalife — compileOnly（Mixin 目标）
    compileOnly fileTree('../../mods') { include '*Firmalife-NeoForge-*.jar' }
    // Jade — compileOnly（可选依赖，仅用于 tooltip 集成）
    compileOnly fileTree('../../mods') { include '*Jade-*.jar' }
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}
